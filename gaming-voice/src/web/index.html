<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-zoom="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GamingVoice · 虚拟 7.1 调音台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">GV</div>
      <div class="names">
        <h1>GamingVoice</h1>
        <p class="sub">虚拟 7.1 调音台 · 8 声道 → 每方向增益 → 双耳耳机</p>
      </div>
    </div>

    <div class="tools">
      <button id="btnTheme" class="chip" title="切换到白天模式">白天</button>
      <button id="btnZoomOut" class="chip sq" title="缩小界面">A−</button>
      <button id="btnZoomIn" class="chip sq" title="放大界面">A+</button>
      <span id="led" class="led"></span>
      <span id="runText" class="runText">未启动</span>
      <button id="btnRun" class="primary">启动</button>
    </div>
  </header>

  <div id="warn" class="warn hidden"></div>

  <section class="panel devices">
    <label class="field">
      <span>源 · 采集哪条端点（要 8 声道）</span>
      <select id="selSource"></select>
      <em id="srcMeta" class="meta">—</em>
    </label>
    <label class="field">
      <span>输出 · 耳机</span>
      <select id="selSink"></select>
      <em id="snkMeta" class="meta">—</em>
    </label>
    <label class="field wide">
      <span>方位数据 · HRIR（决定前后能不能分）</span>
      <select id="selHrir"></select>
      <em id="hrirMeta" class="meta">—</em>
    </label>
    <div class="devActions">
      <button id="btnRefresh" class="ghost" title="重新枚举音频端点（插拔设备后用）">刷新设备</button>
      <div class="meterBox">
        <div class="kv"><i>处理块</i><b id="kBlock">—</b></div>
        <div class="kv"><i>缓冲</i><b id="kBuf">—</b></div>
        <div class="kv"><i>欠载</i><b id="kXrun">—</b></div>
        <div class="kv"><i>已运行</i><b id="kUp">—</b></div>
      </div>
    </div>
  </section>

  <main>
    <section class="panel channels">
      <div class="panelHead">
        <h2>方向增益</h2>
        <div class="presets">
          <button data-preset="flat">平直</button>
          <button data-preset="tac">战术·脚步</button>
          <button data-preset="cinema">影院</button>
          <button data-preset="front">只听前方</button>
          <button data-preset="muteBack">后方静音</button>
        </div>
      </div>
      <div id="chList"></div>
      <p class="note">
        增益加在 <b>卷积之前</b>，所以调一个方向不会动到其它方向 —— 这是它能成立的全部原因。
      </p>
    </section>

    <aside class="panel radarPanel">
      <div class="panelHead">
        <h2>声场</h2>
        <span id="clipTag" class="tag hidden">削波风险</span>
      </div>
      <svg id="radar" viewBox="0 0 300 300" role="img" aria-label="声场方位图"></svg>
      <p class="hint">半径 = 该方向增益，拖动左侧滑块会实时变化；圆点亮度 = 该方向的实时电平。</p>
      <div class="globals">
        <label class="mini">
          <span>总补偿</span>
          <input id="makeup" type="range" min="-30" max="12" step="0.5">
          <b id="makeupVal">—</b>
        </label>
        <!--
          块长入口已按需求锁定为 480（10 ms），先注释掉、不删除，
          等以后有更稳的低延迟方案（独占模式 / IAudioClient3 小周期）再放开。
        <label class="mini">
          <span>块长</span>
          <select id="block">
            <option value="64">64（1.3 ms）</option>
            <option value="128">128（2.7 ms）</option>
            <option value="256">256（5.3 ms）</option>
            <option value="480">480（10 ms，当前固定）</option>
          </select>
        </label>
        -->
        <div class="mini ro">
          <span>块长</span>
          <b>480 样本 · 10.0 ms（已固定）</b>
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <span>GamingVoice · 独立音频通路，不经过 PureVox 的单声道引擎。</span>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
