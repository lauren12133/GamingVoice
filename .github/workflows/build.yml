name: Build GamingVoice (Windows)

on:
  workflow_dispatch:        # 手动触发
  push:
    tags: ['v*']            # 打 tag 时自动出包
  pull_request:             # 提 PR 时跑一遍检查

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gaming-voice

      - name: Check formatting
        working-directory: gaming-voice
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        working-directory: gaming-voice
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: gaming-voice
        run: cargo test

      - name: Build release
        working-directory: gaming-voice
        run: cargo build --release

      # build.rs 也会复制，但这里再显式兜底一次：无论安装包放在仓库根、
      # gaming-voice/ 还是 assets/，都保证发布目录里有它。
      - name: Bundle VB-CABLE installer
        shell: pwsh
        run: |
          $candidates = @(
            'VBCABLE_Setup_x64.exe',
            'gaming-voice/VBCABLE_Setup_x64.exe',
            'gaming-voice/assets/VBCABLE_Setup_x64.exe'
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($src) {
            Copy-Item $src 'gaming-voice/target/release/VBCABLE_Setup_x64.exe' -Force
            Write-Host "bundled VB-CABLE installer from: $src"
          } else {
            Write-Host 'WARN: VBCABLE_Setup_x64.exe not found in repo'
          }

      - name: Upload release (exe + VB-CABLE installer)
        uses: actions/upload-artifact@v4
        with:
          name: GamingVoice-windows-x64
          path: |
            gaming-voice/target/release/GamingVoice.exe
            gaming-voice/target/release/VBCABLE_Setup_x64.exe
          if-no-files-found: error
