name: Build GamingVoice (Windows)

on:
  workflow_dispatch:        # 手动触发
  push:
    tags: ['v*']            # 打 tag 时自动出包
  pull_request:             # 提 PR 时跑一遍检查

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gaming-voice

      - name: Check formatting
        working-directory: gaming-voice
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        working-directory: gaming-voice
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: gaming-voice
        run: cargo test

      - name: Build release
        working-directory: gaming-voice
        run: cargo build --release

      # 集成 VB-CABLE 压缩包：寻找仓库里的 VBCABLE_Driver.zip 并复制到产物目录
      - name: Bundle VB-CABLE installer (zip)
        shell: pwsh
        run: |
          $candidates = @(
            'VBCABLE_Driver.zip',
            'gaming-voice/VBCABLE_Driver.zip',
            'gaming-voice/assets/VBCABLE_Driver.zip'
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($src) {
            Copy-Item $src 'gaming-voice/target/release/VBCABLE_Driver.zip' -Force
            Write-Host "bundled VB-CABLE zip from: $src"
          } else {
            Write-Host 'WARN: VBCABLE_Driver.zip not found in repo'
          }

      - name: Upload release (exe + VB-CABLE zip)
        uses: actions/upload-artifact@v4
        with:
          name: GamingVoice-windows-x64
          path: |
            gaming-voice/target/release/GamingVoice.exe
            gaming-voice/target/release/VBCABLE_Driver.zip
          if-no-files-found: error
